user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;
    sendfile on;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1000;
    server {
        listen 8080;
        listen [::]:8080;
        client_max_body_size 30m;
        server_name _;
        root /app/public/admin-preview;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location ~ /\. { deny all; }
        location = /up { try_files /nonexistent @api; }
        location /api/ { try_files /nonexistent @api; }
        location /storage/ {
            alias /app/storage/app/public/;
            add_header X-Content-Type-Options nosniff;
            add_header Cache-Control "public, max-age=3600";
        }
        location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
        location @api {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 120s;
        }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
}
